[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddo-book-tracker"
version = "0.1.0"
description = "Track books checked out from the Dollard-des-Ormeaux library, with due dates, across linked family accounts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ddo-tracker = "ddo_tracker.cli:main"

[tool.setuptools]
packages = ["ddo_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
