# Fancier "bookshelf" dashboard — a responsive grid of cover tiles grouped by
# family member, with color-coded due badges.
#
# Requires ONE HACS Frontend card: "button-card" (custom:button-card), which is
# actively maintained and in the default HACS store:
#   HACS → search "button-card" → install → refresh.
#
# Covers come from Open Library by ISBN; books without a cover fall back to a
# coloured gradient tile with the title. It auto-discovers the integration's
# per-account sensors (any sensor with a `books` attribute), so there are no
# entity IDs to fill in.
#
# To use: Edit dashboard → Add card → Manual → paste this YAML.

type: custom:button-card
show_icon: false
show_name: false
show_state: false
tap_action:
  action: none
# Re-render whenever any entity changes (we read several sensors, not one).
triggers_update: all
styles:
  card:
    - padding: 14px 16px 18px
  grid:
    - grid-template-areas: '"shelf"'
    - grid-template-columns: 1fr
  custom_fields:
    shelf:
      - justify-self: stretch
custom_fields:
  shelf: |
    [[[
      const accts = Object.values(hass.states)
        .filter(s => s.entity_id.startsWith('sensor.') && s.attributes && s.attributes.books !== undefined)
        .sort((a,b) => (a.attributes.account_name||'').localeCompare(b.attributes.account_name||''))
        .sort((a,b) => (b.attributes.is_primary?1:0) - (a.attributes.is_primary?1:0));
      const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      let total = 0, over = 0;
      accts.forEach(a => { total += parseInt(a.state)||0; over += parseInt(a.attributes.overdue_count)||0; });
      let html = `<div class="ddo-summary">📚 ${total} book${total===1?'':'s'} out${over?` · <span class="over">${over} overdue</span>`:''}</div>`;
      if (!accts.length) html = `<div class="ddo-empty">No DDO library sensors found yet. Is the integration set up?</div>`;
      for (const a of accts) {
        const books = (a.attributes.books||[]).slice()
          .sort((x,y) => String(x.due_date||'').localeCompare(String(y.due_date||'')));
        const od = parseInt(a.attributes.overdue_count)||0;
        html += `<div class="ddo-group"><div class="ddo-head">${a.attributes.is_primary?'★ ':''}${esc(a.attributes.account_name)}<span class="ddo-count">${a.state} out${od?` · ${od} overdue`:''}</span></div>`;
        if (!books.length) { html += `<div class="ddo-empty">Nothing out 🎉</div></div>`; continue; }
        html += `<div class="ddo-grid">`;
        for (const b of books) {
          const d = b.days_until_due;
          let lvl, when;
          if (d==null) { lvl='none'; when='—'; }
          else if (d<0) { lvl='over'; when=(-d)+'d over'; }
          else if (d===0) { lvl='soon'; when='today'; }
          else if (d<=3) { lvl='soon'; when=d+'d'; }
          else if (d<=7) { lvl='ok'; when=d+'d'; }
          else { lvl='far'; when=d+'d'; }
          const hue = ((String(b.title).length*47 + String(b.author).length*13) % 360 + 360) % 360;
          const cover = b.isbn ? `background-image:url(https://covers.openlibrary.org/b/isbn/${encodeURIComponent(b.isbn)}-M.jpg?default=false);` : '';
          html += `<div class="ddo-tile"><div class="ddo-cover" style="--hue:${hue};${cover}"><span class="ddo-badge ${lvl}">${esc(when)}</span><span class="ddo-scrim">${esc(b.title)}</span></div><div class="ddo-author">${esc(b.author)}</div></div>`;
        }
        html += `</div></div>`;
      }
      return `<style>
        .ddo-summary { font-size: 1.05em; font-weight: 600; margin: 2px 2px 14px; }
        .ddo-summary .over { color: #e5484d; }
        .ddo-group { margin-bottom: 20px; }
        .ddo-head { display: flex; align-items: baseline; gap: 8px; font-weight: 700;
          font-size: 1.05em; margin: 0 2px 10px; padding-bottom: 6px;
          border-bottom: 1px solid var(--divider-color, #8884); }
        .ddo-head .ddo-count { margin-left: auto; font-weight: 500; opacity: .7; font-size: .82em; }
        .ddo-empty { opacity: .6; font-style: italic; margin: 2px 2px 4px; }
        .ddo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px; }
        .ddo-tile { min-width: 0; text-align: left; }
        .ddo-cover { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
          background-size: cover; background-position: center; box-shadow: 0 2px 7px #0000006b; }
        .ddo-cover::before { content: ""; position: absolute; inset: 0; z-index: -1;
          background: linear-gradient(135deg, hsl(var(--hue), 58%, 56%), hsl(calc(var(--hue) + 45), 60%, 40%)); }
        .ddo-badge { position: absolute; top: 6px; right: 6px; padding: 2px 7px; border-radius: 999px;
          font-size: .72em; font-weight: 700; color: #fff; box-shadow: 0 1px 3px #0007; }
        .ddo-badge.over { background: #e5484d; } .ddo-badge.soon { background: #f76808; }
        .ddo-badge.ok { background: #46a758; } .ddo-badge.far { background: #5b6472; }
        .ddo-badge.none { background: #5b6472; }
        .ddo-scrim { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px;
          font-size: .77em; font-weight: 600; line-height: 1.15; color: #fff;
          background: linear-gradient(transparent, #000000a6 55%, #000000d9);
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .ddo-author { font-size: .72em; opacity: .72; margin: 4px 2px 0; line-height: 1.2;
          display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
      </style>` + html;
    ]]]
