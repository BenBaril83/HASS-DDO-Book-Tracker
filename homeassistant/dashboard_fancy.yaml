# Fancier "bookshelf" dashboard — ONE combined, de-duplicated grid of cover
# tiles for everything the family currently has out, with color-coded due
# badges, a small "who has it" label per book, and a shared "Holds" list.
#
# Why de-duplicate? DDO's owner/primary card reports the whole family's loans
# as one aggregate, and each linked child card reports that person's subset —
# so a naive "one section per card" view shows every book twice (once on the
# aggregate, once on the child) and doubles the totals. This card merges all
# cards, collapses the aggregate+child copy of the same checkout into a single
# tile (preferring the child's name for the label), and shows a flat shelf.
#
# Requires ONE HACS Frontend card: "button-card" (custom:button-card), which is
# actively maintained and in the default HACS store:
#   HACS → search "button-card" → install → refresh.
#
# Covers come from Open Library by ISBN; books without a cover fall back to a
# coloured gradient tile with the title. It auto-discovers the integration's
# per-account sensors (any sensor exposing `is_primary`), so there are no
# entity IDs to fill in.
#
# To use: Edit dashboard → Add card → Manual → paste this YAML.

type: custom:button-card
show_icon: false
show_name: false
show_state: false
tap_action:
  action: none
# Re-render whenever any entity changes (we read several sensors, not one).
triggers_update: all
styles:
  card:
    - padding: 14px 16px 18px
  grid:
    - grid-template-areas: '"shelf"'
    - grid-template-columns: 1fr
  custom_fields:
    shelf:
      - justify-self: stretch
custom_fields:
  shelf: |
    [[[
      const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      // Every per-account sensor. AccountSensor is the only entity that exposes
      // `is_primary`, so this cleanly excludes the summary / reading-history
      // sensors that also carry a `books` attribute.
      const accts = Object.values(hass.states).filter(s =>
        s.entity_id.startsWith('sensor.') && s.attributes &&
        s.attributes.is_primary !== undefined && s.attributes.books !== undefined);

      // Merge loans across all cards, collapsing the same physical checkout that
      // the aggregate (owner) card and a child card both report. Key on the copy
      // (isbn, else title+author) plus its due date; prefer a non-primary card's
      // name so each book still shows who actually has it.
      const byKey = new Map();
      for (const a of accts) {
        const owner = a.attributes.account_name || '';
        const primary = !!a.attributes.is_primary;
        for (const b of (a.attributes.books || [])) {
          const id = b.isbn ? 'i:' + b.isbn
            : 't:' + String(b.title).toLowerCase() + '|' + String(b.author).toLowerCase();
          const key = id + '|' + (b.due_date || '');
          const cur = byKey.get(key);
          if (!cur) byKey.set(key, { book: b, owner, ownerIsPrimary: primary });
          else if (cur.ownerIsPrimary && !primary) { cur.owner = owner; cur.ownerIsPrimary = false; }
        }
      }
      const books = [...byKey.values()]
        .sort((x, y) => String(x.book.due_date || '').localeCompare(String(y.book.due_date || '')));

      // De-duplicated holds across all cards (reservations have no due date).
      const rezMap = new Map();
      for (const a of accts) {
        const owner = a.attributes.account_name || '';
        for (const r of (a.attributes.reservations || [])) {
          const key = r.isbn ? 'i:' + r.isbn : 't:' + String(r.title).toLowerCase();
          if (!rezMap.has(key)) rezMap.set(key, { r, owner });
        }
      }
      const holds = [...rezMap.values()]
        .sort((x, y) => (y.r.is_ready ? 1 : 0) - (x.r.is_ready ? 1 : 0)
          || (x.r.queue_position || 0) - (y.r.queue_position || 0));

      const total = books.length;
      const over = books.filter(e => e.book.days_until_due != null && e.book.days_until_due < 0).length;
      const ready = holds.filter(h => h.r.is_ready).length;

      if (!accts.length) {
        return `<style></style><div class="ddo-empty">No DDO library sensors found yet. Is the integration set up?</div>`;
      }

      let html = `<div class="ddo-summary">📚 ${total} out${over ? ` · <span class="over">${over} overdue</span>` : ''}${ready ? ` · <span class="ready">🔔 ${ready} ready to pick up</span>` : ''}</div>`;
      if (!books.length) html += `<div class="ddo-empty">Nothing out 🎉</div>`;

      html += `<div class="ddo-grid">`;
      for (const e of books) {
        const b = e.book;
        const d = b.days_until_due;
        let lvl, when;
        if (d == null) { lvl = 'none'; when = '—'; }
        else if (d < 0) { lvl = 'over'; when = (-d) + 'd over'; }
        else if (d === 0) { lvl = 'soon'; when = 'today'; }
        else if (d <= 3) { lvl = 'soon'; when = d + 'd'; }
        else if (d <= 7) { lvl = 'ok'; when = d + 'd'; }
        else { lvl = 'far'; when = d + 'd'; }
        const hue = ((String(b.title).length * 47 + String(b.author).length * 13) % 360 + 360) % 360;
        const cover = b.isbn ? `background-image:url(https://covers.openlibrary.org/b/isbn/${encodeURIComponent(b.isbn)}-M.jpg?default=false);` : '';
        html += `<div class="ddo-tile"><div class="ddo-cover" style="--hue:${hue};${cover}"><span class="ddo-badge ${lvl}">${esc(when)}</span><span class="ddo-scrim">${esc(b.title)}</span></div><div class="ddo-author">${esc(b.author)}</div>${e.owner ? `<div class="ddo-owner">👤 ${esc(e.owner)}</div>` : ''}</div>`;
      }
      html += `</div>`;

      if (holds.length) {
        html += `<div class="ddo-holds"><div class="ddo-holds-h">Holds</div>`;
        for (const h of holds) {
          const r = h.r;
          const st = r.is_ready
            ? `<span class="ddo-hbadge ready">Ready${r.available_until ? ` · by ${r.available_until}` : ''}</span>`
            : `<span class="ddo-hbadge queue">#${r.queue_position} in queue</span>`;
          html += `<div class="ddo-hrow">${st}<span class="ddo-htitle">${esc(r.title)}</span>${h.owner ? `<span class="ddo-howner">${esc(h.owner)}</span>` : ''}</div>`;
        }
        html += `</div>`;
      }

      return `<style>
        .ddo-summary { font-size: 1.05em; font-weight: 600; margin: 2px 2px 14px; }
        .ddo-summary .over { color: #e5484d; }
        .ddo-summary .ready { color: #46a758; }
        .ddo-empty { opacity: .6; font-style: italic; margin: 2px 2px 4px; }
        .ddo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px; }
        .ddo-tile { min-width: 0; text-align: left; }
        .ddo-cover { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
          background-size: cover; background-position: center; box-shadow: 0 2px 7px #0000006b; }
        .ddo-cover::before { content: ""; position: absolute; inset: 0; z-index: -1;
          background: linear-gradient(135deg, hsl(var(--hue), 58%, 56%), hsl(calc(var(--hue) + 45), 60%, 40%)); }
        .ddo-badge { position: absolute; top: 6px; right: 6px; padding: 2px 7px; border-radius: 999px;
          font-size: .72em; font-weight: 700; color: #fff; box-shadow: 0 1px 3px #0007; }
        .ddo-badge.over { background: #e5484d; } .ddo-badge.soon { background: #f76808; }
        .ddo-badge.ok { background: #46a758; } .ddo-badge.far { background: #5b6472; }
        .ddo-badge.none { background: #5b6472; }
        .ddo-scrim { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px;
          font-size: .77em; font-weight: 600; line-height: 1.15; color: #fff;
          background: linear-gradient(transparent, #000000a6 55%, #000000d9);
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .ddo-author { font-size: .72em; opacity: .72; margin: 4px 2px 0; line-height: 1.2;
          display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .ddo-owner { font-size: .7em; opacity: .85; margin: 2px 2px 0; line-height: 1.2;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ddo-holds { margin: 18px 2px 0; }
        .ddo-holds-h { font-size: .72em; font-weight: 700; opacity: .6; text-transform: uppercase;
          letter-spacing: .5px; margin-bottom: 5px; }
        .ddo-hrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: .9em; }
        .ddo-htitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ddo-howner { flex: none; margin-left: auto; font-size: .8em; opacity: .6; }
        .ddo-hbadge { flex: none; font-size: .72em; font-weight: 700; padding: 1px 8px;
          border-radius: 999px; color: #fff; }
        .ddo-hbadge.ready { background: #46a758; }
        .ddo-hbadge.queue { background: #5b6472; }
      </style>` + html;
    ]]]
